<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Lead Gen Engine Portal</title>
  <link rel="stylesheet" href="/static/portal.css">
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #10b981);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-title {
      font-size: 22px;
      margin-top: 10px;
      background: linear-gradient(to right, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div style="display:inline-flex;width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 20px rgba(59,130,246,0.35);">
          ⚡
        </div>
        <h1 class="login-title">Lead Gen Portal</h1>
        <p style="color:var(--text-secondary);font-size:13px;margin-top:4px;">Pipeline Telemetry & Mobile Action Queue</p>
      </div>

      {% if error %}
      <div class="error-alert">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      <form action="/login" method="post">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="admin" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary">
          Sign In to Portal →
        </button>
      </form>

      <div style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted);">
        Protected by Session Auth & HTTPS Encryption
      </div>
    </div>
  </div>
</body>
</html>
